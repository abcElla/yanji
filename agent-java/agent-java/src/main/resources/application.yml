spring:
  application:
    name: yanji-agent
  config:
    import: optional:file:./config/application-local.yml
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  ai:
    openai:
      api-key: local-key-not-configured
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        completions-path: /v1/chat/completions
        options:
          model: qwen-plus
          temperature: 0.0
          max-tokens: 2500
          extra-body:
            enable_thinking: false
      embedding:
        enabled: false
    retry:
      max-attempts: 1
server:
  address: 127.0.0.1
  port: 8091
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 16KB
spring.lifecycle.timeout-per-shutdown-phase: 10s
yanji:
  agent:
    content-validation-enabled: false
    research-loop-enabled: false
    planning-budget: 10s
agent:
  receiver-key: ''
  worker-id: yanji-java-local-01
  concurrency: 2
  queue-capacity: 16
  heartbeat-interval: 25s
  run-budget: 90s
  max-input-chars: 45000
  backend:
    base-url: http://127.0.0.1:8000
    service-key: configure-the-backend-service-key-at-least-32-chars
    connect-timeout: 3s
    read-timeout: 5s
    max-attempts: 2
    retry-backoff: 200ms
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
logging:
  level:
    org.springframework.ai.retry: OFF
    org.springframework.ai.chat.client.advisor: OFF
    org.springframework.web.client: WARN
    com.networknt.schema: ERROR
